<style>
.mappe{min-height:100svh;background:var(--nacht) url('assets/img/tapete-stahl-085.png') 50% 0/150px 170px;padding:max(18px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom))}
.mappe__kopf{display:flex;align-items:center;justify-content:center;gap:14px;color:var(--hellgold);padding:10px 0 18px}
.mappe__kopf svg{width:auto;height:44px}
.mappe__kopf b{font-family:var(--titel);font-weight:700;font-size:18px;letter-spacing:.01em;color:var(--papier)}
.mappe__kopf span{display:block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--hellgold)}
.mappe__fuss{text-align:center;font-size:12px;color:var(--papier);opacity:.7;padding:16px 0 0}
.mappe__fuss a{text-decoration:underline}
/* Die Mappe füllt genau den Bildschirm: Kopf, Gespräch (rollt), Eingabe unten */
html,body.mappe{height:100%}
body.mappe{display:flex;flex-direction:column;height:100svh;overflow:hidden}
.mappe main{flex:1;min-height:0;display:flex;flex-direction:column}
.gast--seite{position:static;width:auto;height:auto;opacity:1;transform:none;pointer-events:auto;visibility:visible;max-width:720px;margin:0 auto;flex:1;min-height:0!important;display:flex;flex-direction:column}
.gast--seite .gast__lauf{min-height:0!important;flex:1}
.mappe__kopf,.mappe__fuss{flex:none}
.im-rahmen body.mappe{padding-top:50px}
/* Zimmermappe schöner (Robert 18.10.2026, 20:33 «das sieht nicht schön aus», 20:36 «Wenn das bie allen häusern so aussieht pass es überall an !»):
   oben das Haus am Abend, die Vorschläge als Kacheln mit Zeichen in zwei Spalten statt grauer Liste, am Laptop links das Bild, rechts die Mappe, ohne leere Fläche */
.mappe__bild{position:relative;margin:-18px -16px 0;height:190px;overflow:hidden}
.mappe__bild img{width:100%;height:100%;object-fit:cover;object-position:50% 62%;display:block}
.mappe__bild::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,22,33,.15),rgba(13,22,33,.35) 55%,var(--nacht))}
.mappe__bild figcaption{display:none}
.mappe__spalte{position:relative;display:flex;flex-direction:column;flex:1;min-height:0;margin-top:-92px}
.mappe .gast__vor{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px}
.mappe .gast__vor button{position:relative;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;gap:12px;min-height:108px;padding:14px 14px 15px;text-align:left;font-size:.95rem;line-height:1.3;border-radius:16px;color:var(--nacht);background:linear-gradient(180deg,#fffdf8,#f6f0e2);box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(184,152,80,.4),0 12px 20px -16px rgba(13,22,33,.55);transition:transform .35s cubic-bezier(.22,.61,.36,1),box-shadow .35s}
.mappe .gast__vor button svg{display:none}
.mappe .gast__vor button::before{content:'';flex:none;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#1d3049,#0d1621);box-shadow:inset 0 0 0 1px rgba(205,184,134,.55)}
.mappe .gast__vor button::after{content:'';position:absolute;left:23px;top:23px;width:20px;height:20px;background:#e3d2a6;-webkit-mask:var(--z) center/contain no-repeat;mask:var(--z) center/contain no-repeat}
.mappe .gast__vor button:nth-child(1){--z:url(assets/img/mappe/bad.svg)}
.mappe .gast__vor button:nth-child(2){--z:url(assets/img/mappe/sauna.svg)}
.mappe .gast__vor button:nth-child(3){--z:url(assets/img/mappe/massage.svg)}
.mappe .gast__vor button:nth-child(4){--z:url(assets/img/mappe/restaurant.svg)}
.mappe .gast__vor button:nth-child(5){--z:url(assets/img/mappe/tisch.svg)}
.mappe .gast__vor button:nth-child(6){--z:url(assets/img/mappe/wetter.svg)}
@media (hover:hover){.mappe .gast__vor button:hover{transform:translateY(-3px);background:linear-gradient(180deg,#fffefb,#f8f3e8);box-shadow:inset 0 1px 0 #fff,0 0 0 1px rgba(184,152,80,.6),0 18px 26px -18px rgba(13,22,33,.6)}}
@media (max-width:999px){
  .mappe__bild{height:150px}
  .mappe__spalte{margin-top:-74px}
  .mappe__kopf{padding:4px 0 12px}
  .mappe .gast__vor{gap:8px}
  .mappe .gast__vor button{flex-direction:row;align-items:center;gap:10px;min-height:66px;padding:10px 10px 10px 10px;font-size:.88rem;line-height:1.28}
  .mappe .gast__vor button::before{width:32px;height:32px}
  .mappe .gast__vor button::after{left:18px;top:50%;width:16px;height:16px;margin-top:-8px}
}
@media (min-width:1000px){
  body.mappe{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(560px,640px);height:100svh;padding:0;overflow:hidden}
  .mappe__bild{margin:0;height:100svh}
  .mappe__bild::after{background:linear-gradient(90deg,rgba(13,22,33,0) 55%,rgba(13,22,33,.55)),linear-gradient(180deg,rgba(13,22,33,0) 50%,rgba(13,22,33,.7))}
  .mappe__bild figcaption{display:block;position:absolute;left:56px;bottom:52px;z-index:1;color:var(--papier)}
  .mappe__bild figcaption span{display:block;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--hellgold)}
  .mappe__bild figcaption b{display:block;margin-top:8px;font-family:var(--titel);font-weight:700;font-size:clamp(2.4rem,3.4vw,3.4rem);line-height:1.05}
  .mappe__bild figcaption small{display:block;margin-top:10px;font-size:14px;opacity:.8}
  .mappe__spalte{margin:0;height:100svh;padding:28px 36px 22px;justify-content:center;background:var(--nacht) url('assets/img/tapete-stahl-085.png') 50% 0/150px 170px}
  .mappe main{flex:none}
  .mappe .gast--seite{flex:none;max-height:calc(100svh - 180px)}
  .mappe .gast--seite .gast__lauf{flex:1 1 auto;min-height:0;overflow:auto}
}
/* Kacheln mit Fotos des Hauses (Robert 18.10.2026, 23:48: «da auch Bilder einfügen … dass es aussieht mit Bildern schön»): oben ein kleines echtes Foto, darunter die Frage */
.mappe .gast__vor button{padding:0 0 13px;gap:10px;overflow:hidden;min-height:0;justify-content:flex-start}
.mappe .gast__vor button::before{width:100%;height:auto;aspect-ratio:16/10;border-radius:0;background:var(--f) center/cover no-repeat,#16263c;box-shadow:none}
.mappe .gast__vor button::after{display:none}
.mappe .gast__vor button>span{padding:0 13px}
.mappe .gast__vor button:nth-child(1){--f:url(assets/img/mappe/foto-bad.webp)}
.mappe .gast__vor button:nth-child(2){--f:url(assets/img/mappe/foto-sauna.webp)}
.mappe .gast__vor button:nth-child(3){--f:url(assets/img/mappe/foto-massage.webp)}
.mappe .gast__vor button:nth-child(4){--f:url(assets/img/mappe/foto-restaurant.webp)}
.mappe .gast__vor button:nth-child(5){--f:url(assets/img/mappe/foto-tisch.webp)}
.mappe .gast__vor button:nth-child(6){--f:url(assets/img/mappe/foto-wetter.webp)}
@media (min-width:1000px){body.mappe{grid-template-columns:minmax(0,1fr) minmax(620px,700px)}.mappe .gast__vor{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:999px){.mappe .gast__vor button{flex-direction:column;align-items:stretch;padding:0 0 10px;min-height:0}.mappe .gast__vor button::before{width:100%;height:auto;aspect-ratio:21/9}.mappe .gast__vor button{gap:7px;padding-bottom:9px}.mappe .gast__vor button>span{font-size:.84rem;line-height:1.25}.mappe__bild{height:120px}.mappe__spalte{margin-top:-64px}.mappe .gast__vor button>span{padding:0 10px}}
</style>
